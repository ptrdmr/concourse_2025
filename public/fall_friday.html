<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Concourse Fall – Friday Specials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fall-specials.css">
<style>
  .strip { width: 1920px; height: 270px; }
  .strip-brand { width: 230px; min-width: 230px; }
  .strip-day { width: 190px; min-width: 190px; }
  .lockup { flex-direction: column; gap: 7px; }
  .lockup-brand { font-size: 30px; }
  .lockup-season { font-size: 64px; }
  .strip-day-name { font-size: 72px; }
  .deal {
    grid-template-columns: 1fr 400px;
    grid-template-rows: 1fr 82px;
    align-items: center;
    padding: 10px 44px 0;
  }
  .deal-name { font-size: 96px; text-align: left; }
  .deal-price { font-size: 196px; }
  .deal-time {
    grid-column: 1 / -1;
    margin: 0 -44px;
    font-size: 44px;
  }
  .leaves {
    width: 720px;
    top: -90px;
    left: 360px;
    opacity: 0.18;
  }
</style>
</head>
<body>
<div class="strip">
  <img class="leaves" src="leaves.svg" alt="" aria-hidden="true">
  <div class="strip-brand">
    <div class="lockup">
      <div class="lockup-brand">Concourse</div>
      <div class="lockup-season">Fall</div>
      <div class="lockup-line">Lanes, Games &amp; Goodtimes!</div>
      <div class="lockup-tag">Fall Specials 2026</div>
    </div>
  </div>
  <div class="strip-day">
    <div class="strip-day-name">Friday</div>
  </div>
  <div class="strip-specials">
    <div class="deal">
      <div class="deal-name">3 Games &amp; Shoes</div>
      <div class="deal-price">$14</div>
      <div class="deal-time">Open – 3pm · Per person · Shoes included</div>
    </div>
  </div>
</div>
</body>
</html>
