<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Concourse Summer – Friday Specials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #C8195A;
    --yellow: #FFC300;
    --bg: #3A3A3A;
    --bg-dark: #2E2E2E;
    --white: #ffffff;
    --light: rgba(255,255,255,0.7);
  }

  html, body { background: #000; overflow: hidden; }

  .banner {
    width: 1920px;
    height: 270px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: stretch;
    font-family: 'Barlow Condensed', 'Barlow', sans-serif;
    color: var(--white);
  }

  .banner::before, .banner::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 5px;
    background: var(--pink);
    z-index: 10;
  }
  .banner::before { top: 0; }
  .banner::after  { bottom: 0; }

  .brand {
    width: 240px;
    min-width: 240px;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    gap: 4px;
  }

  .logo { width: 210px; height: auto; }

  .tag {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--light);
  }

  .day-strip {
    width: 200px;
    min-width: 200px;
    background: var(--pink);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .day-name {
    font-size: 56px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--white);
    text-align: center;
    line-height: 1;
  }

  .specials {
    flex: 1;
    display: flex;
    align-items: stretch;
  }

  .special {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 24px;
    gap: 2px;
    position: relative;
    text-align: center;
  }

  .special + .special::before {
    content: '';
    position: absolute;
    left: 0; top: 10%; bottom: 10%;
    width: 2px;
    background: rgba(255,255,255,0.12);
  }

  .special-name {
    font-size: 42px;
    font-weight: 900;
    text-transform: uppercase;
    color: var(--white);
    letter-spacing: 2px;
    line-height: 1;
  }

  .special-desc {
    font-size: 30px;
    font-weight: 600;
    color: var(--light);
    font-family: 'Barlow', sans-serif;
    line-height: 1.2;
  }

  .special-time {
    font-size: 26px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    font-family: 'Barlow', sans-serif;
  }

  .price {
    font-size: 110px;
    font-weight: 900;
    color: var(--yellow);
    line-height: 1;
  }

  .badge {
    font-size: 64px;
    font-weight: 900;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 3px;
    line-height: 1;
  }
</style>
</head>
<body>
<div class="banner">

  <div class="brand">
    <img src="../exports/menu-jpegs/concourse_summer_logo_colors.png" class="logo" />
    <div class="tag">Summer Specials 2026</div>
  </div>

  <div class="day-strip">
    <div class="day-name">Friday</div>
  </div>

  <div class="specials">
    <div class="special">
      <div class="special-name">First Roll</div>
      <div class="price">$13</div>
      <div class="special-desc">3 games · Shoes not included</div>
      <div class="special-time">Open – 2pm · Per person</div>
    </div>
    <div class="special">
      <div class="special-name">Cosmic<br>Bowling</div>
      <div class="badge">2pm –<br>Close</div>
      <div class="special-desc">Lights down, music up</div>
      <div class="special-time">Friday nights</div>
    </div>
  </div>

</div>
</body>
</html>
