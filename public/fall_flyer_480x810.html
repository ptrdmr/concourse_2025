<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=480">
<title>Concourse Fall Specials – 480×810 Flyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fall-specials.css">
<style>
  .flyer { width: 480px; height: 810px; }
  .flyer-head {
    height: 132px;
    flex-direction: column;
    justify-content: center;
    padding: 16px 14px 10px;
  }
  .lockup { gap: 8px; }
  .lockup-brand { font-size: 19px; }
  .lockup-season { font-size: 52px; }
  .head-right { margin-top: 8px; text-align: center; }
  .kicker { font-size: 20px; }
  .run { margin-top: 4px; font-size: 13px; }
  .deals { grid-template-rows: 1fr 7px 1fr; }
  .flyer-deal {
    grid-template-rows: 44px 1fr 46px 29px;
    padding: 8px 10px 6px;
  }
  .flyer-deal-name { font-size: 37px; }
  .flyer-deal-price { font-size: 205px; }
  .flyer-deal-window { margin: 0 -10px; font-size: 23px; }
  .flyer-deal-meta { font-size: 13px; }
</style>
</head>
<body>
<div class="flyer">
  <div class="flyer-head">
    <div class="lockup">
      <div class="lockup-brand">Concourse</div>
      <div class="lockup-season">Fall</div>
      <div class="lockup-line">Lanes, Games &amp; Goodtimes!</div>
    </div>
    <div class="head-right">
      <div class="kicker">Fall Specials 2026</div>
      <div class="run">Sept 8 — Oct 30</div>
    </div>
  </div>
  <div class="deals">
    <div class="flyer-deal">
      <div class="flyer-deal-name">3 Games &amp; Shoes</div>
      <div class="flyer-deal-price">$14</div>
      <div class="flyer-deal-window">Tue – Fri · Open – 3pm</div>
      <div class="flyer-deal-meta">Per person · Shoes included</div>
    </div>
    <div class="gutter-h"></div>
    <div class="flyer-deal">
      <div class="flyer-deal-name">Unlimited Bowling</div>
      <div class="flyer-deal-price">$18</div>
      <div class="flyer-deal-window">Tue – Thu · 8pm – Close</div>
      <div class="flyer-deal-meta">2 hours · Shoes included · Per person</div>
    </div>
  </div>
</div>
</body>
</html>
