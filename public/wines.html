<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Concourse – Wine List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #D42027;
    --bg: #111111;
    --bg2: #1c1c1c;
    --green: #9BCD00;
  }

  html, body {
    background: #000;
    overflow: hidden;
  }

  .screen {
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .screen::before, .screen::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 6px;
    background: var(--red);
    z-index: 10;
  }
  .screen::before { top: 0; }
  .screen::after { bottom: 0; }

  .beer-board {
    flex: 1;
    min-height: 0;
    width: 1920px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, var(--bg2) 60%, #242424);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 56px 80px 72px;
    font-family: 'Barlow Condensed', sans-serif;
    color: #fff;
  }

  .beer-board::after {
    content: 'CONCOURSE';
    position: absolute;
    inset: 0;
    width: max-content;
    height: max-content;
    margin: auto;
    font-size: 286px;
    font-weight: 900;
    line-height: 1;
    color: rgba(255,255,255,0.035);
    letter-spacing: 10px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 0;
  }

  .wine-center {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1680px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 52px;
  }

  .wine-section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  .section-title {
    font-size: 100px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 4px;
    line-height: 1;
    color: #fff;
    text-align: center;
  }

  .wine-rows {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    width: 100%;
  }

  .wine-row {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 48px 60px;
    max-width: 100%;
  }

  .wine-row--nowrap {
    flex-wrap: nowrap;
  }

  /* One wine per row, centered (avoids clipping long names side-by-side) */
  .wine-row--single {
    flex-wrap: nowrap;
    justify-content: center;
    width: 100%;
  }

  /* Each wine: one horizontal line; categories keep all wines on one row */
  .wine-item {
    display: flex;
    flex-direction: row;
    align-items: baseline;
    flex-wrap: nowrap;
    gap: 15px 21px;
    white-space: nowrap;
    flex: 0 0 auto;
  }

  .wine-name {
    font-size: 51px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.1;
  }

  .wine-meta {
    font-size: 36px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--green);
    letter-spacing: 0.5px;
  }

  .wine-meta .sep {
    margin: 0 8px;
    opacity: 0.5;
    color: rgba(255,255,255,0.45);
  }

  /* Glass $ amounts use same type as bottle column */
  .wine-bottle,
  .wine-glass-price {
    font-size: 60px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    margin-left: 3px;
  }

  .section-rule {
    width: min(720px, 55vw);
    height: 1px;
    background: rgba(255,255,255,0.12);
  }

  .tagline {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 27px;
    letter-spacing: 8px;
    color: rgba(255,255,255,0.15);
    font-style: italic;
    z-index: 1;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="screen">
  <div class="beer-board">

    <div class="wine-center">

      <section class="wine-section" aria-label="Red wines">
        <h2 class="section-title">Reds</h2>
        <div class="wine-row">
          <div class="wine-item">
            <span class="wine-name">Trinity Oaks Merlot</span>
            <span class="wine-meta">Glass </span>
            <span class="wine-glass-price">$6</span>
            <span class="wine-meta"><span class="sep">·</span>Bottle</span>
            <span class="wine-bottle">$22</span>
          </div>
          <div class="wine-item">
            <span class="wine-name">Trinity Oaks Cabernet</span>
            <span class="wine-meta">Glass </span>
            <span class="wine-glass-price">$6</span>
            <span class="wine-meta"><span class="sep">·</span>Bottle</span>
            <span class="wine-bottle">$22</span>
          </div>
        </div>
      </section>

      <div class="section-rule" aria-hidden="true"></div>

      <section class="wine-section" aria-label="White wines">
        <h2 class="section-title">White</h2>
        <div class="wine-rows">
          <div class="wine-row wine-row--single">
            <div class="wine-item">
              <span class="wine-name">Trinity Oaks Pinot Grigio</span>
              <span class="wine-meta">Glass </span>
              <span class="wine-glass-price">$6</span>
              <span class="wine-meta"><span class="sep">·</span>Bottle</span>
              <span class="wine-bottle">$22</span>
            </div>
          </div>
          <div class="wine-row wine-row--single">
            <div class="wine-item">
              <span class="wine-name">Trinity Oaks Chardonnay</span>
              <span class="wine-meta">Glass </span>
              <span class="wine-glass-price">$6</span>
              <span class="wine-meta"><span class="sep">·</span>Bottle</span>
              <span class="wine-bottle">$22</span>
            </div>
          </div>
          <div class="wine-row wine-row--single">
            <div class="wine-item">
              <span class="wine-name">Josh Chardonnay</span>
              <span class="wine-meta">Glass </span>
              <span class="wine-glass-price">$10</span>
            </div>
          </div>
        </div>
      </section>

      <div class="section-rule" aria-hidden="true"></div>

      <section class="wine-section" aria-label="Champagne">
        <h2 class="section-title">Champagne</h2>
        <div class="wine-row">
          <div class="wine-item">
            <span class="wine-name">J. Roget Brut</span>
            <span class="wine-meta">Split </span>
            <span class="wine-glass-price">$7</span>
          </div>
        </div>
      </section>

    </div>

    <div class="tagline">Bowl · Bar · Grill</div>

  </div>
</div>

</body>
</html>
