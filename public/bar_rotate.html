<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Concourse — Bar menu rotation</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  iframe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
</style>
</head>
<body>
<!-- Rotates: draft_1 → draft_2 → bottles_cans → wines. Params: ?s=seconds (min 5, default 7), ?start=0–3 -->
<iframe id="menu" title="Rotating menu display" src="/draft_1"></iframe>
<script>
(function () {
  var MENUS = ['/draft_1', '/draft_2', '/bottles_cans', '/wines'];
  var params = new URLSearchParams(window.location.search);
  var sec = parseInt(params.get('s') || params.get('interval') || '7', 10);
  if (isNaN(sec) || sec < 5) sec = 7;
  var start = parseInt(params.get('start') || '0', 10);
  if (isNaN(start)) start = 0;
  start = Math.max(0, Math.min(MENUS.length - 1, start));
  var iframe = document.getElementById('menu');
  var i = start;
  if (i !== 0) iframe.src = MENUS[i];
  setInterval(function () {
    i = (i + 1) % MENUS.length;
    iframe.src = MENUS[i];
  }, sec * 1000);
})();
</script>
</body>
</html>
