<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=608">
<title>Concourse Fall Specials – 608×1080 Flyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fall-specials.css">
<style>
  .flyer { width: 608px; height: 1080px; }
  .flyer-head {
    height: 188px;
    flex-direction: column;
    justify-content: center;
    padding: 20px 20px 14px;
  }
  .lockup { gap: 10px; }
  .lockup-brand { font-size: 30px; }
  .lockup-season { font-size: 66px; }
  .head-right { margin-top: 10px; text-align: center; }
  .kicker { font-size: 30px; }
  .run { margin-top: 5px; font-size: 19px; }
  .deals { grid-template-rows: 1fr 8px 1fr; }
  .flyer-deal {
    grid-template-rows: 58px 1fr 68px 42px;
    padding: 10px 14px 8px;
  }
  .flyer-deal-name { font-size: 48px; }
  .flyer-deal-price { font-size: 260px; }
  .flyer-deal-window { margin: 0 -14px; font-size: 34px; }
  .flyer-deal-meta { font-size: 20px; }
  .leaves--a {
    width: 540px;
    top: 120px;
    left: -110px;
  }
  .leaves--b {
    width: 500px;
    right: -100px;
    bottom: -50px;
    transform: scaleX(-1);
    opacity: 0.16;
  }
</style>
</head>
<body>
<div class="flyer">
  <img class="leaves leaves--a" src="leaves.svg" alt="" aria-hidden="true">
  <img class="leaves leaves--b" src="leaves.svg" alt="" aria-hidden="true">
  <div class="flyer-head">
    <div class="lockup">
      <div class="lockup-brand">Concourse</div>
      <div class="lockup-season">Fall</div>
      <div class="lockup-line">Lanes, Games &amp; Goodtimes!</div>
    </div>
    <div class="head-right">
      <div class="kicker">Fall Specials 2026</div>
      <div class="run">Sept 8 — Oct 30</div>
    </div>
  </div>
  <div class="deals">
    <div class="flyer-deal">
      <div class="flyer-deal-name">3 Games &amp; Shoes</div>
      <div class="flyer-deal-price">$14</div>
      <div class="flyer-deal-window">Tue – Fri · Open – 3pm</div>
      <div class="flyer-deal-meta">Per person · Shoes included</div>
    </div>
    <div class="gutter-h"></div>
    <div class="flyer-deal">
      <div class="flyer-deal-name">Unlimited Bowling</div>
      <div class="flyer-deal-price">$18</div>
      <div class="flyer-deal-window">Tue – Thu · 8pm – Close</div>
      <div class="flyer-deal-meta">2 hours · Shoes included · Per person</div>
    </div>
  </div>
</div>
</body>
</html>
