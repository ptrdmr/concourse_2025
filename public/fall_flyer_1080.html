<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Concourse Fall Specials – 16:9 Flyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fall-specials.css">
<style>
  .flyer { width: 1920px; height: 1080px; }
  .flyer-head {
    height: 164px;
    padding: 24px 48px 20px;
  }
  .lockup { gap: 20px; }
  .lockup-brand { font-size: 48px; }
  .lockup-season { font-size: 94px; }
  .kicker { font-size: 51px; }
  .run { margin-top: 10px; font-size: 28px; }
  .deals { grid-template-columns: 1fr 12px 1fr; }
  .flyer-deal {
    grid-template-rows: 116px 1fr 108px 66px;
    padding: 20px 24px 18px;
  }
  .flyer-deal-name { font-size: 86px; }
  .flyer-deal-price { font-size: 410px; }
  .flyer-deal-window { margin: 0 -24px; font-size: 56px; }
  .flyer-deal-meta { font-size: 31px; }
  .leaves--a {
    width: 1320px;
    top: 70px;
    left: -220px;
  }
  .leaves--b {
    width: 1180px;
    right: -240px;
    bottom: -60px;
    transform: scaleX(-1);
    opacity: 0.16;
  }
</style>
</head>
<body>
<div class="flyer">
  <img class="leaves leaves--a" src="leaves.svg" alt="" aria-hidden="true">
  <img class="leaves leaves--b" src="leaves.svg" alt="" aria-hidden="true">
  <div class="flyer-head">
    <div class="lockup lockup--hero">
      <div class="lockup-brand">Concourse</div>
      <div class="lockup-season">Fall</div>
      <div class="lockup-line">Lanes, Games &amp; Goodtimes!</div>
    </div>
    <div class="head-right">
      <div class="kicker">Fall Specials 2026</div>
      <div class="run">Sept 8 — Oct 30</div>
    </div>
  </div>
  <div class="deals">
    <div class="flyer-deal">
      <div class="flyer-deal-name">3 Games &amp; Shoes</div>
      <div class="flyer-deal-price">$14</div>
      <div class="flyer-deal-window">Tue – Fri · Open – 3pm</div>
      <div class="flyer-deal-meta">Per person · Shoes included</div>
    </div>
    <div class="gutter-v"></div>
    <div class="flyer-deal">
      <div class="flyer-deal-name">Unlimited Bowling</div>
      <div class="flyer-deal-price">$18</div>
      <div class="flyer-deal-window">Tue – Thu · 8pm – Close</div>
      <div class="flyer-deal-meta">2 hours · Shoes included · Per person</div>
    </div>
  </div>
</div>
</body>
</html>
