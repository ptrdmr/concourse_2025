<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Concourse Fall – Friday Specials (1280)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fall-specials.css">
<style>
  .strip { width: 1280px; height: 328px; }
  .strip-brand { width: 170px; min-width: 170px; }
  .strip-day { width: 140px; min-width: 140px; }
  .strip-day-name { font-size: 62px; }
  .deal {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 28px;
    gap: 12px;
  }
  .deal-name { font-size: 48px; text-align: left; justify-self: start; }
  .deal-price { font-size: 240px; }
  .deal-time { font-size: 26px; text-align: right; justify-self: end; color: var(--forest); }
</style>
</head>
<body>
<div class="strip">
  <div class="strip-brand">
    <div class="lockup lockup--strip-sm lockup--on-dark">
      <div class="lockup-brand">Concourse</div>
      <div class="lockup-season">Fall</div>
      <div class="lockup-line">Lanes, Games &amp; Goodtimes!</div>
      <div class="lockup-tag">Fall Specials 2026</div>
    </div>
  </div>
  <div class="strip-day">
    <div class="strip-day-name">Friday</div>
  </div>
  <div class="strip-specials">
    <div class="deal">
      <div class="deal-name">3 Games<br>&amp; Shoes</div>
      <div class="deal-price">$14</div>
      <div class="deal-time">Open – 3pm<br>Per person</div>
    </div>
  </div>
</div>
</body>
</html>
