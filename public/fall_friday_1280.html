<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Concourse Fall – Friday Specials (1280)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fall-specials.css">
<style>
  .strip { width: 1280px; height: 328px; }
  .strip-brand { width: 170px; min-width: 170px; }
  .strip-day { width: 140px; min-width: 140px; }
  .lockup { flex-direction: column; gap: 7px; }
  .lockup-brand { font-size: 20px; }
  .lockup-season { font-size: 58px; }
  .strip-day-name { font-size: 62px; }
  .deal {
    grid-template-columns: 1fr 280px;
    grid-template-rows: 1fr 72px;
    align-items: center;
    padding: 10px 28px 0;
  }
  .deal-name { font-size: 70px; text-align: left; }
  .deal-price { font-size: 215px; }
  .deal-time {
    grid-column: 1 / -1;
    margin: 0 -28px;
    font-size: 31px;
  }
</style>
</head>
<body>
<div class="strip">
  <div class="strip-brand">
    <div class="lockup">
      <div class="lockup-brand">Concourse</div>
      <div class="lockup-season">Fall</div>
      <div class="lockup-line">Lanes, Games &amp; Goodtimes!</div>
      <div class="lockup-tag">Fall Specials 2026</div>
    </div>
  </div>
  <div class="strip-day">
    <div class="strip-day-name">Friday</div>
  </div>
  <div class="strip-specials">
    <div class="deal">
      <div class="deal-name">3 Games &amp; Shoes</div>
      <div class="deal-price">$14</div>
      <div class="deal-time">Open – 3pm · Per person · Shoes included</div>
    </div>
  </div>
</div>
</body>
</html>
