<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Concourse Fall – Tue–Thu Specials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fall-specials.css">
<style>
  .strip { width: 1920px; height: 270px; }
  .strip-brand { width: 240px; min-width: 240px; }
  .strip-day { width: 210px; min-width: 210px; }
  .strip-day-name { font-size: 72px; }
  .deal {
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 6px 8px 8px 20px;
  }
  .deal-name { font-size: 48px; }
  .deal-price { font-size: 200px; display: flex; align-items: center; justify-content: center; }
  .deal-time { font-size: 24px; }
</style>
</head>
<body>
<div class="strip">
  <div class="strip-brand">
    <div class="lockup lockup--strip lockup--on-dark">
      <div class="lockup-brand">Concourse</div>
      <div class="lockup-season">Fall</div>
      <div class="lockup-line">Lanes, Games &amp; Goodtimes!</div>
      <div class="lockup-tag">Fall Specials 2026</div>
    </div>
  </div>
  <div class="strip-day">
    <div class="strip-day-name">Tue –<br>Thu</div>
  </div>
  <div class="strip-specials">
    <div class="deal">
      <div class="deal-name">3 Games &amp; Shoes</div>
      <div class="deal-price">$14</div>
      <div class="deal-time">Open – 3pm · Per person</div>
    </div>
    <div class="deal">
      <div class="deal-name">Unlimited Bowling</div>
      <div class="deal-price">$18</div>
      <div class="deal-time">8pm – Close · Per person</div>
    </div>
  </div>
</div>
</body>
</html>
